name: AegisRAG CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-verify:
    name: Build, Typecheck & Test
    runs-on: ubuntu-latest

    env:
      API_AUTH_SECRET: ci-secret-auth-token-test-2026
      GEMMA_ENDPOINT: http://localhost:8081/completion
      PORT: 3001
      LOG_LEVEL: silent
      DOTENV_CONFIG_QUIET: 'true'
      CI: 'true'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Bootstrap Environment
        run: |
          cp .env.example .env
          echo "API_AUTH_SECRET=ci-secret-auth-token-test-2026" > .env
          echo "PORT=3001" >> .env
          echo "GEMMA_ENDPOINT=http://localhost:8081/completion" >> .env
          echo "LOG_LEVEL=silent" >> .env

      - name: Install dependencies
        run: |
          npm install
          npm rebuild better-sqlite3

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Run Automated Test Suites
        run: npm test
