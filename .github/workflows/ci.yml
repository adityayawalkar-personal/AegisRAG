name: AegisRAG CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-verify:
    name: Build, Typecheck & Test
    runs-on: ubuntu-latest

    env:
      API_AUTH_SECRET: ci-secret-auth-token-test-2026
      GEMMA_ENDPOINT: http://localhost:8081/completion
      PORT: 3001

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Bootstrap Environment
        run: cp .env.example .env

      - name: Install dependencies
        run: npm install

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Run Automated Test Suites
        run: npm test
